name: Build Watermelon Genetics

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew Valley and SMAPI reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Patch standalone root-list data support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ContentBridge.cs')
          s = p.read_text(encoding='utf-8')
          old = '''        if (targetField is null || targetField.Count == 0)\n        {\n            ApplyDictionaryEntries(rootData, entries);\n            return;\n        }'''
          new = '''        if (targetField is null || targetField.Count == 0)\n        {\n            if (rootData is IDictionary)\n            {\n                ApplyDictionaryEntries(rootData, entries);\n                return;\n            }\n\n            if (rootData is IList rootList)\n            {\n                ApplyListEntries(rootList, entries);\n                return;\n            }\n\n            throw new InvalidOperationException($"Unsupported root data type {rootData.GetType().FullName}.");\n        }'''
          if old not in s:
              raise SystemExit('Expected ContentBridge root-data block was not found.')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          GAME_PATH="$HOME/.steam/steam/steamapps/common/Stardew Valley"
          dotnet build src/WatermelonGenetics.csproj -c Release /p:GamePath="$GAME_PATH" 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          mkdir -p dist
          cp build.log dist/build.log
          if [ "$STATUS" -eq 0 ] && [ -f src/bin/Release/net6.0/WatermelonGenetics.dll ]; then
            cp src/bin/Release/net6.0/WatermelonGenetics.dll dist/WatermelonGenetics.dll
            echo success > dist/status.txt
          else
            rm -f dist/WatermelonGenetics.dll
            echo failure > dist/status.txt
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload compiled DLL artifact
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: WatermelonGenetics-dll
          path: dist/WatermelonGenetics.dll
          if-no-files-found: error

      - name: Commit build output on main push
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/build.log dist/status.txt
          if [ -f dist/WatermelonGenetics.dll ]; then git add -f dist/WatermelonGenetics.dll; fi
          git commit -m "Store Watermelon Genetics build output [skip ci]" || true
          git push

      - name: Fail workflow if build failed
        if: steps.build.outputs.status != '0'
        shell: bash
        run: exit 1
