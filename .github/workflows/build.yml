name: Build Watermelon Genetics

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew Valley and SMAPI reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          GAME_PATH="$HOME/.steam/steam/steamapps/common/Stardew Valley"
          dotnet build src/WatermelonGenetics.csproj -c Release /p:GamePath="$GAME_PATH" 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          mkdir -p dist
          rm -rf dist/chunks
          cp build.log dist/build.log
          if [ "$STATUS" -eq 0 ] && [ -f src/bin/Release/net6.0/WatermelonGenetics.dll ]; then
            cp src/bin/Release/net6.0/WatermelonGenetics.dll dist/WatermelonGenetics.dll
            echo success > dist/status.txt
            mkdir -p dist/chunks
            base64 -w 0 dist/WatermelonGenetics.dll > dist/WatermelonGenetics.dll.b64
            split -b 8000 -d -a 3 dist/WatermelonGenetics.dll.b64 dist/chunks/chunk-
            wc -c dist/WatermelonGenetics.dll > dist/dll-size.txt
            sha256sum dist/WatermelonGenetics.dll > dist/dll-sha256.txt
          else
            rm -f dist/WatermelonGenetics.dll dist/WatermelonGenetics.dll.b64
            echo failure > dist/status.txt
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit build output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/build.log dist/status.txt
          if [ -f dist/WatermelonGenetics.dll ]; then
            git add -f dist/WatermelonGenetics.dll dist/chunks dist/dll-size.txt dist/dll-sha256.txt
          fi
          git commit -m "Store Watermelon Genetics build output [skip ci]" || true
          git push

      - name: Fail workflow if build failed
        if: steps.build.outputs.status != '0'
        shell: bash
        run: exit 1
