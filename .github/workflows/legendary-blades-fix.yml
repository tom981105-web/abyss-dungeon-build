name: Build Legendary Blades Fix

on:
  push:
    branches: [ legendary-blades-fix-20260829 ]
    paths:
      - 'legendary-blades-fix/**'
      - '.github/workflows/legendary-blades-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew Valley and SMAPI reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Apply v1.2.2 spend-right forge hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('legendary-blades-fix/ModEntry.cs')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Hotfix target not found: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'internal const string VersionText = "1.1.0";',
              'internal const string VersionText = "1.2.2";',
              'version text'
          )
          replace_once(
              'if (Blades.TryGetValue(id, out BladeData? blade))\n            GiveItem(MakeWeapon(blade, true));',
              'if (Blades.TryGetValue(id, out BladeData? selectedBlade))\n            GiveItem(MakeWeapon(selectedBlade, true));',
              'GiveEvolved local name'
          )
          replace_once(
              '[HarmonyPatch]\ninternal static class ForgeCraftPatch',
              'internal static class ForgeCraftPatch',
              'disable old CraftItem patch'
          )
          replace_once(
              'helper.ConsoleCommands.Add("legendaryblades_diag", "Print Legendary Blades diagnostics.", DiagCommand);',
              'helper.ConsoleCommands.Add("legendaryblades_diag", "Legendary Blades 진단 정보를 표시합니다.", DiagCommand);\n        helper.ConsoleCommands.Add("legendaryblades_status", "현재 선택한 전설의 검 강화 상태를 표시합니다.", StatusCommand);\n        helper.ConsoleCommands.Add("legendaryblades_forceevolve", "복구/테스트용으로 현재 선택한 기본 전설의 검을 강제 진화시킵니다.", ForceEvolveCommand);',
              'commands'
          )
          replace_once(
              'Description = T(evolved ? blade.EvolvedDescKey : blade.BaseDescKey, evolved ? "An awakened Legendary Blade." : "A Legendary Blade."),',
              'Description = T(evolved ? blade.EvolvedDescKey : blade.BaseDescKey, evolved ? "각성한 전설의 검." : "전설의 검."),',
              'description fallback Korean'
          )
          replace_once(
              '''    private void OnSaveLoaded(object? sender, SaveLoadedEventArgs e)\n    {\n        ReconcileProgressionState();\n    }''',
              '''    private void OnSaveLoaded(object? sender, SaveLoadedEventArgs e)\n    {\n        ReconcileProgressionState();\n        RepairCompletedStages();\n    }''',
              'save repair call'
          )
          replace_once(
              '''    private void OnDayStarted(object? sender, DayStartedEventArgs e)\n    {\n        ReconcileProgressionState();\n    }''',
              '''    private void RepairCompletedStages()\n    {\n        if (!Context.IsWorldReady)\n            return;\n\n        foreach (Item? item in Game1.player.Items)\n        {\n            if (item is not MeleeWeapon weapon)\n                continue;\n\n            BladeData? blade = GetBladeForWeapon(weapon, out bool alreadyEvolved);\n            if (blade is null || alreadyEvolved || GetGalaxySoulCount(weapon) < 3)\n                continue;\n\n            string oldId = weapon.ItemId;\n            string oldName = weapon.DisplayName;\n            weapon.transform(blade.EvolvedItemId);\n            weapon.modData.Remove(GalaxySoulDataKey);\n            Game1.showGlobalMessage(T("forge.complete", $"{oldName}이(가) {weapon.DisplayName}(으)로 각성했습니다!", new { name = oldName, evolved = weapon.DisplayName }));\n            Monitor.Log($"v1.2.2 완료된 강화 상태 복구: {oldId} -> {weapon.ItemId}.", LogLevel.Info);\n        }\n    }\n\n    private void OnDayStarted(object? sender, DayStartedEventArgs e)\n    {\n        ReconcileProgressionState();\n        RepairCompletedStages();\n    }''',
              'repair method'
          )
          replace_once(
              '''    private void DiagCommand(string command, string[] args)\n    {''',
              '''    private void StatusCommand(string command, string[] args)\n    {\n        Monitor.Log("Legendary Blades v1.2.2 선택 무기 상태", LogLevel.Info);\n        if (!Context.IsWorldReady || Game1.player.CurrentTool is not MeleeWeapon weapon)\n        {\n            Monitor.Log("먼저 단축바에서 전설의 검을 선택하세요.", LogLevel.Warn);\n            return;\n        }\n\n        BladeData? blade = GetBladeForWeapon(weapon, out bool evolved);\n        int stage = GetGalaxySoulCount(weapon);\n        Monitor.Log($"아이템ID={weapon.ItemId}; 전체ID={weapon.QualifiedItemId}; 인식됨={blade is not null}; 진화됨={evolved}; 강화단계={stage}; 두번째편지={Game1.player.mailReceived.Contains(Mail2Id)}", LogLevel.Info);\n    }\n\n    private void ForceEvolveCommand(string command, string[] args)\n    {\n        if (!Context.IsWorldReady || Game1.player.CurrentTool is not MeleeWeapon weapon)\n        {\n            Monitor.Log("먼저 단축바에서 기본 전설의 검을 선택하세요.", LogLevel.Warn);\n            return;\n        }\n\n        BladeData? blade = GetBladeForWeapon(weapon, out bool alreadyEvolved);\n        if (blade is null || alreadyEvolved)\n        {\n            Monitor.Log(blade is null ? "선택한 무기는 전설의 검이 아닙니다." : "선택한 전설의 검은 이미 진화했습니다.", LogLevel.Warn);\n            return;\n        }\n\n        string oldId = weapon.ItemId;\n        string oldName = weapon.DisplayName;\n        weapon.transform(blade.EvolvedItemId);\n        weapon.modData.Remove(GalaxySoulDataKey);\n        Game1.showGlobalMessage(T("forge.complete", $"{oldName}이(가) {weapon.DisplayName}(으)로 각성했습니다!", new { name = oldName, evolved = weapon.DisplayName }));\n        Monitor.Log($"v1.2.2 강제 진화: {oldId} -> {weapon.ItemId}.", LogLevel.Info);\n    }\n\n    private void DiagCommand(string command, string[] args)\n    {''',
              'status and recovery commands'
          )
          replace_once(
              'Legendary Blades v1.1.0 - diagnostics',
              'Legendary Blades v1.2.2 - 진단',
              'diagnostics version'
          )

          p.write_text(s, encoding='utf-8')
          PY

          cat > legendary-blades-fix/ForgeSpendRightPatch.cs <<'CS'
          using System;
          using System.Globalization;
          using HarmonyLib;
          using StardewModdingAPI;
          using StardewValley;
          using StardewValley.Enchantments;
          using StardewValley.Menus;
          using StardewValley.Tools;

          namespace LegendaryBlades;

          internal static class LegendaryForge122
          {
              internal static bool IsGalaxySoul(Item? item)
                  => item is not null
                     && (string.Equals(item.QualifiedItemId, ModEntry.GalaxySoulId, StringComparison.Ordinal)
                         || string.Equals(item.ItemId, "896", StringComparison.Ordinal));

              internal static bool TryGetBaseBlade(Item? item, out MeleeWeapon? weapon, out BladeData? blade)
              {
                  weapon = item as MeleeWeapon;
                  blade = null;
                  if (weapon is null)
                      return false;

                  blade = ModEntry.GetBladeForWeapon(weapon, out bool evolved);
                  return blade is not null && !evolved;
              }

              internal static void RemoveVanillaGalaxySoul(MeleeWeapon weapon)
              {
                  GalaxySoulEnchantment? soul = weapon.GetEnchantmentOfType<GalaxySoulEnchantment>();
                  if (soul is not null)
                      weapon.RemoveEnchantment(soul);
              }
          }

          [HarmonyPatch(typeof(Tool), nameof(Tool.CanForge))]
          internal static class LegendaryBladeCanForge122Patch
          {
              private static void Postfix(Tool __instance, Item item, ref bool __result)
              {
                  if (__instance is not MeleeWeapon weapon || !LegendaryForge122.IsGalaxySoul(item))
                      return;

                  BladeData? blade = ModEntry.GetBladeForWeapon(weapon, out bool evolved);
                  if (blade is null || evolved)
                      return;

                  __result = Game1.player.mailReceived.Contains(ModEntry.Mail2Id)
                             && ModEntry.GetGalaxySoulCount(weapon) < 3;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.IsValidCraft))]
          internal static class LegendaryBladeIsValidCraft122Patch
          {
              private static bool Prefix(Item left_item, Item right_item, ref bool __result)
              {
                  if (!LegendaryForge122.TryGetBaseBlade(left_item, out MeleeWeapon? weapon, out _)
                      || !LegendaryForge122.IsGalaxySoul(right_item))
                      return true;

                  __result = Game1.player.mailReceived.Contains(ModEntry.Mail2Id)
                             && ModEntry.GetGalaxySoulCount(weapon!) < 3;
                  return false;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.GetForgeCost))]
          internal static class LegendaryBladeForgeCost122Patch
          {
              private static bool Prefix(Item left_item, Item right_item, ref int __result)
              {
                  if (!LegendaryForge122.TryGetBaseBlade(left_item, out _, out _)
                      || !LegendaryForge122.IsGalaxySoul(right_item))
                      return true;

                  __result = 20;
                  return false;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.IsValidCraftIngredient))]
          internal static class LegendaryBladeIngredient122Patch
          {
              private static void Postfix(Item item, ref bool __result)
              {
                  if (__result || item is null)
                      return;

                  if (LegendaryForge122.IsGalaxySoul(item))
                  {
                      __result = true;
                      return;
                  }

                  if (LegendaryForge122.TryGetBaseBlade(item, out _, out _))
                      __result = true;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.SpendRightItem))]
          internal static class LegendaryBladeSpendRight122Patch
          {
              private static void Prefix(ForgeMenu __instance)
              {
                  Item? right = __instance.rightIngredientSpot?.item;
                  Item? left = __instance.leftIngredientSpot?.item;

                  if (!LegendaryForge122.IsGalaxySoul(right)
                      || !LegendaryForge122.TryGetBaseBlade(left, out MeleeWeapon? weapon, out BladeData? blade)
                      || weapon is null || blade is null)
                      return;

                  if (!Game1.player.mailReceived.Contains(ModEntry.Mail2Id))
                      return;

                  int current = ModEntry.GetGalaxySoulCount(weapon);
                  if (current >= 3)
                      return;

                  LegendaryForge122.RemoveVanillaGalaxySoul(weapon);

                  int next = current + 1;
                  if (next < 3)
                  {
                      weapon.modData[ModEntry.GalaxySoulDataKey] = next.ToString(CultureInfo.InvariantCulture);
                      string stageMessage = ModEntry.T(
                          "forge.stage",
                          $"{weapon.DisplayName}이(가) 갤럭시 소울을 흡수했습니다. {next}/3.",
                          new { name = weapon.DisplayName, stage = next }
                      );
                      Game1.showGlobalMessage(stageMessage);
                      ModEntry.Instance?.Monitor.Log($"v1.2.2 강화 단계 {next}/3: {weapon.ItemId}; 재료={right?.QualifiedItemId}.", LogLevel.Info);
                      return;
                  }

                  string oldId = weapon.ItemId;
                  string oldName = weapon.DisplayName;

                  weapon.modData[ModEntry.GalaxySoulDataKey] = "3";
                  weapon.transform(blade.EvolvedItemId);
                  weapon.modData.Remove(ModEntry.GalaxySoulDataKey);
                  LegendaryForge122.RemoveVanillaGalaxySoul(weapon);

                  string complete = ModEntry.T(
                      "forge.complete",
                      $"{oldName}이(가) {weapon.DisplayName}(으)로 각성했습니다!",
                      new { name = oldName, evolved = weapon.DisplayName }
                  );
                  Game1.showGlobalMessage(complete);
                  ModEntry.Instance?.Monitor.Log($"v1.2.2 진화 완료: {oldId} -> {weapon.ItemId}; 재료={right?.QualifiedItemId}.", LogLevel.Info);
              }
          }
          CS

      - name: Build Legendary Blades v1.2.2
        shell: bash
        run: |
          GAME_PATH="$HOME/.steam/steam/steamapps/common/Stardew Valley"
          dotnet build legendary-blades-fix/LegendaryBlades.csproj -c Release /p:GamePath="$GAME_PATH"

      - name: Stage package
        shell: bash
        run: |
          mkdir -p package/i18n
          cp legendary-blades-fix/bin/Release/net6.0/LegendaryBlades.dll package/LegendaryBlades.dll
          cp legendary-blades-fix/manifest.json package/manifest.json
          cp legendary-blades-fix/i18n/default.json package/i18n/default.json
          cp legendary-blades-fix/i18n/ko.json package/i18n/ko.json

      - name: Upload v1.2.2 package
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryBlades-v1.2.2-korean
          path: package/
          if-no-files-found: error
