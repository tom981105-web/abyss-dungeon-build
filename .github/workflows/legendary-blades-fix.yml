name: Build Legendary Blades Fix

on:
  push:
    branches: [ legendary-blades-fix-20260829 ]
    paths:
      - 'legendary-blades-fix/**'
      - '.github/workflows/legendary-blades-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew Valley and SMAPI reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Apply v1.2.0 deterministic forge hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('legendary-blades-fix/ModEntry.cs')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Hotfix target not found: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'using StardewValley;\n',
              'using StardewValley;\nusing StardewValley.Enchantments;\n',
              'GalaxySoulEnchantment using'
          )
          replace_once(
              'internal const string VersionText = "1.1.0";',
              'internal const string VersionText = "1.2.0";',
              'version text'
          )
          replace_once(
              'if (Blades.TryGetValue(id, out BladeData? blade))\n            GiveItem(MakeWeapon(blade, true));',
              'if (Blades.TryGetValue(id, out BladeData? selectedBlade))\n            GiveItem(MakeWeapon(selectedBlade, true));',
              'GiveEvolved local name'
          )
          replace_once(
              '[HarmonyPatch]\ninternal static class ForgeCraftPatch',
              'internal static class ForgeCraftPatch',
              'disable old forge prefix'
          )
          replace_once(
              'helper.ConsoleCommands.Add("legendaryblades_diag", "Print Legendary Blades diagnostics.", DiagCommand);',
              'helper.ConsoleCommands.Add("legendaryblades_diag", "Print Legendary Blades diagnostics.", DiagCommand);\n        helper.ConsoleCommands.Add("legendaryblades_status", "Print selected Legendary Blade forge state.", StatusCommand);\n        helper.ConsoleCommands.Add("legendaryblades_forceevolve", "Force-evolve the selected base Legendary Blade for recovery/testing.", ForceEvolveCommand);',
              'diagnostic command registration'
          )
          replace_once(
              '''    private void OnSaveLoaded(object? sender, SaveLoadedEventArgs e)\n    {\n        ReconcileProgressionState();\n    }''',
              '''    private void OnSaveLoaded(object? sender, SaveLoadedEventArgs e)\n    {\n        ReconcileProgressionState();\n        RepairStuckBlades();\n    }''',
              'save repair call'
          )
          replace_once(
              '''    private void OnDayStarted(object? sender, DayStartedEventArgs e)\n    {\n        ReconcileProgressionState();\n    }''',
              '''    private void RepairStuckBlades()\n    {\n        if (!Context.IsWorldReady)\n            return;\n\n        for (int i = 0; i < Game1.player.Items.Count; i++)\n        {\n            if (Game1.player.Items[i] is not MeleeWeapon weapon)\n                continue;\n\n            BladeData? blade = GetBladeForWeapon(weapon, out bool alreadyEvolved);\n            if (blade is null || alreadyEvolved)\n                continue;\n\n            int legacy = GetGalaxySoulCount(weapon);\n            int vanilla = Math.Clamp(weapon.GetEnchantmentLevel<GalaxySoulEnchantment>(), 0, 3);\n            if (Math.Clamp(legacy + vanilla, 0, 3) < 3)\n                continue;\n\n            string oldName = weapon.DisplayName;\n            MeleeWeapon evolved = MakeWeapon(blade, true);\n            CopyWeaponState(weapon, evolved);\n            evolved.modData.Remove(GalaxySoulDataKey);\n            GalaxySoulEnchantment? soul = evolved.GetEnchantmentOfType<GalaxySoulEnchantment>();\n            if (soul is not null)\n                evolved.RemoveEnchantment(soul);\n\n            Game1.player.Items[i] = evolved;\n            string message = T("forge.complete", $"{oldName} has awakened into {evolved.DisplayName}!", new { name = oldName, evolved = evolved.DisplayName });\n            Game1.showGlobalMessage(message);\n            Monitor.Log($"v1.2.0 repaired stuck blade in slot {i}: {weapon.ItemId} -> {evolved.ItemId} (legacy={legacy}, vanilla={vanilla}).", LogLevel.Info);\n        }\n    }\n\n    private void OnDayStarted(object? sender, DayStartedEventArgs e)\n    {\n        ReconcileProgressionState();\n        RepairStuckBlades();\n    }''',
              'stuck blade repair method'
          )
          replace_once(
              '''    private void DiagCommand(string command, string[] args)\n    {''',
              '''    private void StatusCommand(string command, string[] args)\n    {\n        Monitor.Log("Legendary Blades v1.2.0 selected-weapon status", LogLevel.Info);\n        if (!Context.IsWorldReady)\n        {\n            Monitor.Log("No save is loaded.", LogLevel.Warn);\n            return;\n        }\n\n        if (Game1.player.CurrentTool is not MeleeWeapon weapon)\n        {\n            Monitor.Log("Select a Legendary Blade in the hotbar first.", LogLevel.Warn);\n            return;\n        }\n\n        BladeData? blade = GetBladeForWeapon(weapon, out bool evolved);\n        int legacy = GetGalaxySoulCount(weapon);\n        int vanilla = Math.Clamp(weapon.GetEnchantmentLevel<GalaxySoulEnchantment>(), 0, 3);\n        Monitor.Log($"ItemId={weapon.ItemId}; Qualified={weapon.QualifiedItemId}; recognized={blade is not null}; evolved={evolved}; legacyStage={legacy}; vanillaStage={vanilla}; mail2={Game1.player.mailReceived.Contains(Mail2Id)}", LogLevel.Info);\n    }\n\n    private void ForceEvolveCommand(string command, string[] args)\n    {\n        if (!Context.IsWorldReady || Game1.player.CurrentTool is not MeleeWeapon weapon)\n        {\n            Monitor.Log("Select a base Legendary Blade in the hotbar first.", LogLevel.Warn);\n            return;\n        }\n\n        BladeData? blade = GetBladeForWeapon(weapon, out bool alreadyEvolved);\n        if (blade is null || alreadyEvolved)\n        {\n            Monitor.Log(blade is null ? "The selected weapon is not a Legendary Blade." : "The selected Legendary Blade is already evolved.", LogLevel.Warn);\n            return;\n        }\n\n        int slot = Game1.player.Items.IndexOf(weapon);\n        if (slot < 0)\n        {\n            Monitor.Log("Could not find the selected weapon in the inventory.", LogLevel.Error);\n            return;\n        }\n\n        string oldName = weapon.DisplayName;\n        MeleeWeapon evolved = MakeWeapon(blade, true);\n        CopyWeaponState(weapon, evolved);\n        evolved.modData.Remove(GalaxySoulDataKey);\n        GalaxySoulEnchantment? soul = evolved.GetEnchantmentOfType<GalaxySoulEnchantment>();\n        if (soul is not null)\n            evolved.RemoveEnchantment(soul);\n        Game1.player.Items[slot] = evolved;\n\n        string message = T("forge.complete", $"{oldName} has awakened into {evolved.DisplayName}!", new { name = oldName, evolved = evolved.DisplayName });\n        Game1.showGlobalMessage(message);\n        Monitor.Log($"v1.2.0 force-evolved slot {slot}: {weapon.ItemId} -> {evolved.ItemId}.", LogLevel.Info);\n    }\n\n    private void DiagCommand(string command, string[] args)\n    {''',
              'status and recovery commands'
          )
          replace_once(
              'Legendary Blades v1.1.0 - diagnostics',
              'Legendary Blades v1.2.0 - diagnostics',
              'diagnostics version'
          )

          p.write_text(s, encoding='utf-8')
          PY

          cat > legendary-blades-fix/DeterministicForgePatch.cs <<'CS'
          using System;
          using System.Globalization;
          using HarmonyLib;
          using StardewModdingAPI;
          using StardewValley;
          using StardewValley.Enchantments;
          using StardewValley.Menus;
          using StardewValley.Tools;

          namespace LegendaryBlades;

          internal static class LegendaryBladeStage
          {
              internal static int Legacy(MeleeWeapon weapon)
              {
                  if (weapon.modData.TryGetValue(ModEntry.GalaxySoulDataKey, out string? raw)
                      && int.TryParse(raw, NumberStyles.Integer, CultureInfo.InvariantCulture, out int parsed))
                      return Math.Clamp(parsed, 0, 3);
                  return 0;
              }

              internal static int Vanilla(MeleeWeapon weapon)
                  => Math.Clamp(weapon.GetEnchantmentLevel<GalaxySoulEnchantment>(), 0, 3);

              internal static int Current(MeleeWeapon weapon)
                  => Math.Clamp(Math.Max(Legacy(weapon), Vanilla(weapon)), 0, 3);

              internal static void RemoveVanillaSoul(MeleeWeapon weapon)
              {
                  GalaxySoulEnchantment? soul = weapon.GetEnchantmentOfType<GalaxySoulEnchantment>();
                  if (soul is not null)
                      weapon.RemoveEnchantment(soul);
              }

              internal static MeleeWeapon MakeEvolved(MeleeWeapon source, BladeData blade)
              {
                  MeleeWeapon evolved = ModEntry.MakeWeapon(blade, true);
                  ModEntry.CopyWeaponState(source, evolved);
                  evolved.modData.Remove(ModEntry.GalaxySoulDataKey);
                  RemoveVanillaSoul(evolved);
                  return evolved;
              }
          }

          [HarmonyPatch(typeof(Tool), nameof(Tool.CanForge))]
          internal static class LegendaryBladeCanForgeDeterministicPatch
          {
              private static void Postfix(Tool __instance, Item item, ref bool __result)
              {
                  if (__instance is not MeleeWeapon weapon || item?.QualifiedItemId != ModEntry.GalaxySoulId)
                      return;

                  BladeData? blade = ModEntry.GetBladeForWeapon(weapon, out bool evolved);
                  if (blade is null || evolved)
                      return;

                  bool unlocked = Game1.player.mailReceived.Contains(ModEntry.Mail2Id);
                  __result = unlocked && LegendaryBladeStage.Current(weapon) < 3;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.CraftItem))]
          internal static class LegendaryBladeCraftDeterministicPatch
          {
              private static bool Prefix(Item left_item, Item right_item, bool forReal, ref Item? __result)
              {
                  if (left_item is not MeleeWeapon weapon || right_item?.QualifiedItemId != ModEntry.GalaxySoulId)
                      return true;

                  BladeData? blade = ModEntry.GetBladeForWeapon(weapon, out bool alreadyEvolved);
                  if (blade is null || alreadyEvolved)
                      return true;

                  if (!Game1.player.mailReceived.Contains(ModEntry.Mail2Id))
                  {
                      if (forReal)
                          Game1.showRedMessage(ModEntry.T("story.forge.locked", "These blades have not revealed their secret to you yet."));
                      __result = null;
                      return false;
                  }

                  int stage = Math.Clamp(Math.Max(LegendaryBladeStage.Legacy(weapon), LegendaryBladeStage.Vanilla(weapon)), 0, 2);

                  // Preview path: ForgeMenu calls CraftItem on a clone while validating the recipe.
                  if (!forReal)
                  {
                      __result = stage >= 2 ? LegendaryBladeStage.MakeEvolved(weapon, blade) : weapon;
                      return false;
                  }

                  // From v1.2.0 onward this mod owns the Galaxy Soul counter for its custom blades.
                  // Normalize any leftover vanilla GalaxySoulEnchantment from earlier broken builds first.
                  LegendaryBladeStage.RemoveVanillaSoul(weapon);
                  weapon.modData[ModEntry.GalaxySoulDataKey] = stage.ToString(CultureInfo.InvariantCulture);

                  int nextStage = stage + 1;
                  if (nextStage < 3)
                  {
                      weapon.modData[ModEntry.GalaxySoulDataKey] = nextStage.ToString(CultureInfo.InvariantCulture);
                      __result = weapon;

                      string stageMessage = ModEntry.T(
                          "forge.stage",
                          $"{weapon.DisplayName} absorbed Galaxy Soul {nextStage} of 3.",
                          new { name = weapon.DisplayName, stage = nextStage }
                      );
                      Game1.showGlobalMessage(stageMessage);
                      ModEntry.Instance?.Monitor.Log($"v1.2.0 deterministic forge {nextStage}/3: {weapon.ItemId}.", LogLevel.Info);
                      return false;
                  }

                  string oldName = weapon.DisplayName;
                  string oldId = weapon.ItemId;
                  MeleeWeapon evolved = LegendaryBladeStage.MakeEvolved(weapon, blade);
                  __result = evolved;

                  string message = ModEntry.T(
                      "forge.complete",
                      $"{oldName} has awakened into {evolved.DisplayName}!",
                      new { name = oldName, evolved = evolved.DisplayName }
                  );
                  Game1.showGlobalMessage(message);
                  ModEntry.Instance?.Monitor.Log($"v1.2.0 deterministic EVOLUTION: {oldId} -> {evolved.ItemId}.", LogLevel.Info);
                  return false;
              }
          }
          CS

      - name: Build Legendary Blades v1.2.0
        shell: bash
        run: |
          GAME_PATH="$HOME/.steam/steam/steamapps/common/Stardew Valley"
          dotnet build legendary-blades-fix/LegendaryBlades.csproj -c Release /p:GamePath="$GAME_PATH"

      - name: Upload standalone DLL
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryBlades-v1.2.0-deterministic-forge
          path: legendary-blades-fix/bin/Release/net6.0/LegendaryBlades.dll
          if-no-files-found: error
