name: Build Legendary Blades Fix

on:
  push:
    branches: [ legendary-blades-fix-20260829 ]
    paths:
      - 'legendary-blades-fix/**'
      - '.github/workflows/legendary-blades-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew Valley and SMAPI reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Apply v1.2.1 spend-right forge hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('legendary-blades-fix/ModEntry.cs')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Hotfix target not found: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'internal const string VersionText = "1.1.0";',
              'internal const string VersionText = "1.2.1";',
              'version text'
          )
          replace_once(
              'if (Blades.TryGetValue(id, out BladeData? blade))\n            GiveItem(MakeWeapon(blade, true));',
              'if (Blades.TryGetValue(id, out BladeData? selectedBlade))\n            GiveItem(MakeWeapon(selectedBlade, true));',
              'GiveEvolved local name'
          )
          replace_once(
              '[HarmonyPatch]\ninternal static class ForgeCraftPatch',
              'internal static class ForgeCraftPatch',
              'disable old CraftItem patch'
          )
          replace_once(
              'helper.ConsoleCommands.Add("legendaryblades_diag", "Print Legendary Blades diagnostics.", DiagCommand);',
              'helper.ConsoleCommands.Add("legendaryblades_diag", "Print Legendary Blades diagnostics.", DiagCommand);\n        helper.ConsoleCommands.Add("legendaryblades_status", "Print selected Legendary Blade forge state.", StatusCommand);\n        helper.ConsoleCommands.Add("legendaryblades_forceevolve", "Force-evolve the selected base Legendary Blade for recovery/testing.", ForceEvolveCommand);',
              'commands'
          )
          replace_once(
              '''    private void OnSaveLoaded(object? sender, SaveLoadedEventArgs e)\n    {\n        ReconcileProgressionState();\n    }''',
              '''    private void OnSaveLoaded(object? sender, SaveLoadedEventArgs e)\n    {\n        ReconcileProgressionState();\n        RepairCompletedStages();\n    }''',
              'save repair call'
          )
          replace_once(
              '''    private void OnDayStarted(object? sender, DayStartedEventArgs e)\n    {\n        ReconcileProgressionState();\n    }''',
              '''    private void RepairCompletedStages()\n    {\n        if (!Context.IsWorldReady)\n            return;\n\n        foreach (Item? item in Game1.player.Items)\n        {\n            if (item is not MeleeWeapon weapon)\n                continue;\n\n            BladeData? blade = GetBladeForWeapon(weapon, out bool alreadyEvolved);\n            if (blade is null || alreadyEvolved || GetGalaxySoulCount(weapon) < 3)\n                continue;\n\n            string oldId = weapon.ItemId;\n            string oldName = weapon.DisplayName;\n            weapon.transform(blade.EvolvedItemId);\n            weapon.modData.Remove(GalaxySoulDataKey);\n            Game1.showGlobalMessage(T("forge.complete", $"{oldName} has awakened into {weapon.DisplayName}!", new { name = oldName, evolved = weapon.DisplayName }));\n            Monitor.Log($"v1.2.1 repaired completed stage: {oldId} -> {weapon.ItemId}.", LogLevel.Info);\n        }\n    }\n\n    private void OnDayStarted(object? sender, DayStartedEventArgs e)\n    {\n        ReconcileProgressionState();\n        RepairCompletedStages();\n    }''',
              'repair method'
          )
          replace_once(
              '''    private void DiagCommand(string command, string[] args)\n    {''',
              '''    private void StatusCommand(string command, string[] args)\n    {\n        Monitor.Log("Legendary Blades v1.2.1 selected-weapon status", LogLevel.Info);\n        if (!Context.IsWorldReady || Game1.player.CurrentTool is not MeleeWeapon weapon)\n        {\n            Monitor.Log("Select a Legendary Blade in the hotbar first.", LogLevel.Warn);\n            return;\n        }\n\n        BladeData? blade = GetBladeForWeapon(weapon, out bool evolved);\n        int stage = GetGalaxySoulCount(weapon);\n        Monitor.Log($"ItemId={weapon.ItemId}; Qualified={weapon.QualifiedItemId}; recognized={blade is not null}; evolved={evolved}; stage={stage}; mail2={Game1.player.mailReceived.Contains(Mail2Id)}", LogLevel.Info);\n    }\n\n    private void ForceEvolveCommand(string command, string[] args)\n    {\n        if (!Context.IsWorldReady || Game1.player.CurrentTool is not MeleeWeapon weapon)\n        {\n            Monitor.Log("Select a base Legendary Blade in the hotbar first.", LogLevel.Warn);\n            return;\n        }\n\n        BladeData? blade = GetBladeForWeapon(weapon, out bool alreadyEvolved);\n        if (blade is null || alreadyEvolved)\n        {\n            Monitor.Log(blade is null ? "The selected weapon is not a Legendary Blade." : "The selected Legendary Blade is already evolved.", LogLevel.Warn);\n            return;\n        }\n\n        string oldId = weapon.ItemId;\n        string oldName = weapon.DisplayName;\n        weapon.transform(blade.EvolvedItemId);\n        weapon.modData.Remove(GalaxySoulDataKey);\n        Game1.showGlobalMessage(T("forge.complete", $"{oldName} has awakened into {weapon.DisplayName}!", new { name = oldName, evolved = weapon.DisplayName }));\n        Monitor.Log($"v1.2.1 force-evolved: {oldId} -> {weapon.ItemId}.", LogLevel.Info);\n    }\n\n    private void DiagCommand(string command, string[] args)\n    {''',
              'status and recovery commands'
          )
          replace_once(
              'Legendary Blades v1.1.0 - diagnostics',
              'Legendary Blades v1.2.1 - diagnostics',
              'diagnostics version'
          )

          p.write_text(s, encoding='utf-8')
          PY

          cat > legendary-blades-fix/ForgeSpendRightPatch.cs <<'CS'
          using System;
          using System.Globalization;
          using HarmonyLib;
          using StardewModdingAPI;
          using StardewValley;
          using StardewValley.Enchantments;
          using StardewValley.Menus;
          using StardewValley.Tools;

          namespace LegendaryBlades;

          internal static class LegendaryForge121
          {
              internal static bool IsGalaxySoul(Item? item)
                  => item is not null
                     && (string.Equals(item.QualifiedItemId, ModEntry.GalaxySoulId, StringComparison.Ordinal)
                         || string.Equals(item.ItemId, "896", StringComparison.Ordinal));

              internal static bool TryGetBaseBlade(Item? item, out MeleeWeapon? weapon, out BladeData? blade)
              {
                  weapon = item as MeleeWeapon;
                  blade = null;
                  if (weapon is null)
                      return false;

                  blade = ModEntry.GetBladeForWeapon(weapon, out bool evolved);
                  return blade is not null && !evolved;
              }

              internal static void RemoveVanillaGalaxySoul(MeleeWeapon weapon)
              {
                  GalaxySoulEnchantment? soul = weapon.GetEnchantmentOfType<GalaxySoulEnchantment>();
                  if (soul is not null)
                      weapon.RemoveEnchantment(soul);
              }
          }

          [HarmonyPatch(typeof(Tool), nameof(Tool.CanForge))]
          internal static class LegendaryBladeCanForge121Patch
          {
              private static void Postfix(Tool __instance, Item item, ref bool __result)
              {
                  if (__instance is not MeleeWeapon weapon || !LegendaryForge121.IsGalaxySoul(item))
                      return;

                  BladeData? blade = ModEntry.GetBladeForWeapon(weapon, out bool evolved);
                  if (blade is null || evolved)
                      return;

                  __result = Game1.player.mailReceived.Contains(ModEntry.Mail2Id)
                             && ModEntry.GetGalaxySoulCount(weapon) < 3;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.IsValidCraft))]
          internal static class LegendaryBladeIsValidCraft121Patch
          {
              private static bool Prefix(Item left_item, Item right_item, ref bool __result)
              {
                  if (!LegendaryForge121.TryGetBaseBlade(left_item, out MeleeWeapon? weapon, out _)
                      || !LegendaryForge121.IsGalaxySoul(right_item))
                      return true;

                  __result = Game1.player.mailReceived.Contains(ModEntry.Mail2Id)
                             && ModEntry.GetGalaxySoulCount(weapon!) < 3;
                  return false;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.GetForgeCost))]
          internal static class LegendaryBladeForgeCost121Patch
          {
              private static bool Prefix(Item left_item, Item right_item, ref int __result)
              {
                  if (!LegendaryForge121.TryGetBaseBlade(left_item, out _, out _)
                      || !LegendaryForge121.IsGalaxySoul(right_item))
                      return true;

                  __result = 20;
                  return false;
              }
          }

          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.IsValidCraftIngredient))]
          internal static class LegendaryBladeIngredient121Patch
          {
              private static void Postfix(Item item, ref bool __result)
              {
                  if (__result || item is null)
                      return;

                  if (LegendaryForge121.IsGalaxySoul(item))
                  {
                      __result = true;
                      return;
                  }

                  if (LegendaryForge121.TryGetBaseBlade(item, out _, out _))
                      __result = true;
              }
          }

          // This is the critical v1.2.1 hook. ForgeMenu calls SpendRightItem exactly once after a
          // successful craft has completed and immediately before the Galaxy Soul stack is reduced.
          // That is later and more reliable than CraftItem/Tool.Forge, which other mods can bypass.
          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.SpendRightItem))]
          internal static class LegendaryBladeSpendRight121Patch
          {
              private static void Prefix(ForgeMenu __instance)
              {
                  Item? right = __instance.rightIngredientSpot?.item;
                  Item? left = __instance.leftIngredientSpot?.item;

                  if (!LegendaryForge121.IsGalaxySoul(right)
                      || !LegendaryForge121.TryGetBaseBlade(left, out MeleeWeapon? weapon, out BladeData? blade)
                      || weapon is null || blade is null)
                      return;

                  if (!Game1.player.mailReceived.Contains(ModEntry.Mail2Id))
                      return;

                  int current = ModEntry.GetGalaxySoulCount(weapon);
                  if (current >= 3)
                      return;

                  // Remove any hidden vanilla GalaxySoulEnchantment that older/bypassed forge logic may have added.
                  // Legendary Blades owns the 1/3, 2/3, 3/3 counter from here on.
                  LegendaryForge121.RemoveVanillaGalaxySoul(weapon);

                  int next = current + 1;
                  if (next < 3)
                  {
                      weapon.modData[ModEntry.GalaxySoulDataKey] = next.ToString(CultureInfo.InvariantCulture);
                      string stageMessage = ModEntry.T(
                          "forge.stage",
                          $"{weapon.DisplayName} absorbed Galaxy Soul {next} of 3.",
                          new { name = weapon.DisplayName, stage = next }
                      );
                      Game1.showGlobalMessage(stageMessage);
                      ModEntry.Instance?.Monitor.Log($"v1.2.1 SpendRightItem stage {next}/3: {weapon.ItemId}; right={right?.QualifiedItemId}.", LogLevel.Info);
                      return;
                  }

                  string oldId = weapon.ItemId;
                  string oldName = weapon.DisplayName;

                  // Mutate the exact same weapon instance. ForgeMenu's local crafted_item points to this
                  // object, so when it assigns the result to heldItem a few lines later it is already evolved.
                  weapon.modData[ModEntry.GalaxySoulDataKey] = "3";
                  weapon.transform(blade.EvolvedItemId);
                  weapon.modData.Remove(ModEntry.GalaxySoulDataKey);
                  LegendaryForge121.RemoveVanillaGalaxySoul(weapon);

                  string complete = ModEntry.T(
                      "forge.complete",
                      $"{oldName} has awakened into {weapon.DisplayName}!",
                      new { name = oldName, evolved = weapon.DisplayName }
                  );
                  Game1.showGlobalMessage(complete);
                  ModEntry.Instance?.Monitor.Log($"v1.2.1 SpendRightItem EVOLVED: {oldId} -> {weapon.ItemId}; right={right?.QualifiedItemId}.", LogLevel.Info);
              }
          }
          CS

      - name: Build Legendary Blades v1.2.1
        shell: bash
        run: |
          GAME_PATH="$HOME/.steam/steam/steamapps/common/Stardew Valley"
          dotnet build legendary-blades-fix/LegendaryBlades.csproj -c Release /p:GamePath="$GAME_PATH"

      - name: Stage package
        shell: bash
        run: |
          mkdir -p package
          cp legendary-blades-fix/bin/Release/net6.0/LegendaryBlades.dll package/LegendaryBlades.dll
          cp legendary-blades-fix/manifest.json package/manifest.json

      - name: Upload v1.2.1 package
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryBlades-v1.2.1-spend-right-forge
          path: package/
          if-no-files-found: error
