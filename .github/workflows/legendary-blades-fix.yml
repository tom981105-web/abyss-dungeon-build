name: Build Legendary Blades Fix

on:
  push:
    branches: [ legendary-blades-fix-20260829 ]
    paths:
      - 'legendary-blades-fix/**'
      - '.github/workflows/legendary-blades-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add Stardew Valley and SMAPI reference assemblies
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1

      - name: Apply v1.1.3 forge hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('legendary-blades-fix/ModEntry.cs')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Hotfix target not found: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'internal const string VersionText = "1.1.0";',
              'internal const string VersionText = "1.1.3";',
              'version text'
          )
          replace_once(
              'if (Blades.TryGetValue(id, out BladeData? blade))\n            GiveItem(MakeWeapon(blade, true));',
              'if (Blades.TryGetValue(id, out BladeData? selectedBlade))\n            GiveItem(MakeWeapon(selectedBlade, true));',
              'GiveEvolved local name'
          )
          replace_once(
              '[HarmonyPatch]\ninternal static class ForgeCraftPatch',
              'internal static class ForgeCraftPatch',
              'disable legacy CraftItem prefix'
          )
          replace_once(
              'Legendary Blades v1.1.0 - diagnostics',
              'Legendary Blades v1.1.3 - diagnostics',
              'diagnostics version'
          )

          p.write_text(s, encoding='utf-8')
          PY

          cat > legendary-blades-fix/ForgeEvolutionInPlacePatch.cs <<'CS'
          using System;
          using System.Globalization;
          using System.Reflection;
          using HarmonyLib;
          using StardewModdingAPI;
          using StardewValley;
          using StardewValley.Enchantments;
          using StardewValley.Menus;
          using StardewValley.Tools;

          namespace LegendaryBlades;

          // Let the vanilla forge own Galaxy Soul application and the exact 20-shard cost,
          // then evolve our custom blade in-place after the third soul. This mirrors the
          // vanilla Galaxy -> Infinity flow instead of replacing ForgeMenu's return object.
          [HarmonyPatch(typeof(Tool), nameof(Tool.CanForge))]
          internal static class LegendaryBladeCanForgePatch
          {
              private static void Postfix(Tool __instance, Item item, ref bool __result)
              {
                  if (__instance is not MeleeWeapon weapon || item?.QualifiedItemId != ModEntry.GalaxySoulId)
                      return;

                  BladeData? blade = ModEntry.GetBladeForWeapon(weapon, out bool evolved);
                  if (blade is null || evolved)
                      return;

                  // Keep the story gate. ForgeMenu calls CanForge before spending shards.
                  if (!Game1.player.mailReceived.Contains(ModEntry.Mail2Id))
                      __result = false;
              }
          }

          [HarmonyPatch(typeof(Tool), nameof(Tool.Forge))]
          internal static class LegendaryBladeForgeInPlacePatch
          {
              private static void Postfix(Tool __instance, Item item, bool count_towards_stats, bool __result)
              {
                  if (!__result || __instance is not MeleeWeapon weapon || item?.QualifiedItemId != ModEntry.GalaxySoulId)
                      return;

                  BladeData? blade = ModEntry.GetBladeForWeapon(weapon, out bool alreadyEvolved);
                  if (blade is null || alreadyEvolved)
                      return;

                  int legacyStage = 0;
                  if (weapon.modData.TryGetValue(ModEntry.GalaxySoulDataKey, out string? raw)
                      && int.TryParse(raw, NumberStyles.Integer, CultureInfo.InvariantCulture, out int parsed))
                  {
                      legacyStage = Math.Clamp(parsed, 0, 3);
                  }

                  int vanillaStage = Math.Clamp(weapon.GetEnchantmentLevel<GalaxySoulEnchantment>(), 0, 3);
                  int totalStage = Math.Clamp(legacyStage + vanillaStage, 0, 3);

                  // Do NOT mirror vanillaStage back into modData; that would double-count on the next forge.
                  if (totalStage < 3)
                  {
                      if (count_towards_stats)
                      {
                          string stageMessage = ModEntry.T(
                              "forge.stage",
                              $"{weapon.DisplayName} absorbed Galaxy Soul {totalStage} of 3.",
                              new { name = weapon.DisplayName, stage = totalStage }
                          );
                          Game1.showGlobalMessage(stageMessage);
                          ModEntry.Instance?.Monitor.Log($"v1.1.3 forge stage {totalStage}/3 for {weapon.ItemId} (legacy={legacyStage}, vanilla={vanillaStage}).", LogLevel.Info);
                      }
                      return;
                  }

                  string oldName = weapon.DisplayName;
                  string oldId = weapon.ItemId;

                  GalaxySoulEnchantment? soul = weapon.GetEnchantmentOfType<GalaxySoulEnchantment>();
                  bool transformed = TryTransformInPlace(weapon, blade.EvolvedItemId);
                  if (!transformed)
                  {
                      ModEntry.Instance?.Monitor.Log($"v1.1.3 in-place evolution failed: {oldId} -> {blade.EvolvedItemId}.", LogLevel.Error);
                      return;
                  }

                  // Galaxy Souls are the catalyst, not a permanent hidden enchantment on the evolved blade.
                  if (soul is not null)
                      weapon.RemoveEnchantment(soul);
                  weapon.modData.Remove(ModEntry.GalaxySoulDataKey);

                  if (count_towards_stats)
                  {
                      string message = ModEntry.T(
                          "forge.complete",
                          $"{oldName} has awakened into {weapon.DisplayName}!",
                          new { name = oldName, evolved = weapon.DisplayName }
                      );
                      Game1.showGlobalMessage(message);
                      ModEntry.Instance?.Monitor.Log($"v1.1.3 EVOLVED IN PLACE: {oldId} -> {weapon.ItemId}.", LogLevel.Info);
                  }
              }

              private static bool TryTransformInPlace(MeleeWeapon weapon, string newItemId)
              {
                  try
                  {
                      MethodInfo? transform = AccessTools.Method(typeof(MeleeWeapon), "transform", new[] { typeof(string) });
                      if (transform is null)
                          return false;

                      transform.Invoke(weapon, new object[] { newItemId });
                      return string.Equals(weapon.ItemId, newItemId, StringComparison.Ordinal);
                  }
                  catch (Exception ex)
                  {
                      ModEntry.Instance?.Monitor.Log($"v1.1.3 transform exception: {ex.GetType().Name}: {ex.Message}", LogLevel.Error);
                      return false;
                  }
              }
          }

          // Extra safety net: if a future game build changes in-place transform behavior,
          // replace the CraftItem result after vanilla Forge has already recorded the third soul.
          [HarmonyPatch(typeof(ForgeMenu), nameof(ForgeMenu.CraftItem))]
          internal static class LegendaryBladeCraftResultFallbackPatch
          {
              private static void Postfix(Item left_item, Item right_item, bool forReal, ref Item? __result)
              {
                  if (right_item?.QualifiedItemId != ModEntry.GalaxySoulId || __result is not MeleeWeapon weapon)
                      return;

                  BladeData? blade = ModEntry.GetBladeForWeapon(weapon, out bool alreadyEvolved);
                  if (blade is null || alreadyEvolved)
                      return;

                  int legacyStage = 0;
                  if (weapon.modData.TryGetValue(ModEntry.GalaxySoulDataKey, out string? raw)
                      && int.TryParse(raw, NumberStyles.Integer, CultureInfo.InvariantCulture, out int parsed))
                      legacyStage = Math.Clamp(parsed, 0, 3);

                  int vanillaStage = Math.Clamp(weapon.GetEnchantmentLevel<GalaxySoulEnchantment>(), 0, 3);
                  if (Math.Clamp(legacyStage + vanillaStage, 0, 3) < 3)
                      return;

                  MeleeWeapon evolved = ModEntry.MakeWeapon(blade, true);
                  ModEntry.CopyWeaponState(weapon, evolved);
                  evolved.modData.Remove(ModEntry.GalaxySoulDataKey);
                  GalaxySoulEnchantment? soul = evolved.GetEnchantmentOfType<GalaxySoulEnchantment>();
                  if (soul is not null)
                      evolved.RemoveEnchantment(soul);
                  __result = evolved;

                  if (forReal)
                      ModEntry.Instance?.Monitor.Log($"v1.1.3 CraftItem fallback evolved {weapon.ItemId} -> {evolved.ItemId}.", LogLevel.Warn);
              }
          }
          CS

      - name: Build Legendary Blades v1.1.3
        shell: bash
        run: |
          GAME_PATH="$HOME/.steam/steam/steamapps/common/Stardew Valley"
          dotnet build legendary-blades-fix/LegendaryBlades.csproj -c Release /p:GamePath="$GAME_PATH"

      - name: Upload standalone DLL
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryBlades-v1.1.3-inplace-third-forge-fix
          path: legendary-blades-fix/bin/Release/net6.0/LegendaryBlades.dll
          if-no-files-found: error
